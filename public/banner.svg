<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" rx="16" fill="#050505"/>
  <rect x="1" y="1" width="1198" height="398" rx="15" stroke="#262626" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#171717" stroke-width="1"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#171717" stroke-width="1"/>
  <line x1="0" y1="240" x2="1200" y2="240" stroke="#171717" stroke-width="1"/>
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#171717" stroke-width="1"/>
  
  <line x1="240" y1="0" x2="240" y2="400" stroke="#171717" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="400" stroke="#171717" stroke-width="1"/>
  <line x1="720" y1="0" x2="720" y2="400" stroke="#171717" stroke-width="1"/>
  <line x1="960" y1="0" x2="960" y2="400" stroke="#171717" stroke-width="1"/>

  <!-- Glowing Radial Backdrop -->
  <circle cx="600" cy="200" r="280" fill="#ffffff" fill-opacity="0.03" filter="blur(60px)"/>

  <!-- Center Logo Badge -->
  <rect x="540" y="60" width="120" height="120" rx="24" fill="#0f0f0f" stroke="#333333" stroke-width="2"/>
  <text x="600" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" text-anchor="middle" fill="#ffffff">🐺</text>

  <!-- Title & Subtitle -->
  <text x="600" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="4" text-anchor="middle" fill="#ffffff">FENRIS SECURITY</text>
  <text x="600" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" letter-spacing="1" text-anchor="middle" fill="#a3a3a3">Discord Server Guardian • Anti-Nuke • Real-Time Web Console &amp; Bot Platform</text>

  <!-- Status Pills -->
  <g transform="translate(360, 310)">
    <rect width="130" height="34" rx="17" fill="#141414" stroke="#2b2b2b" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#ffffff"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ededed">Discord.js v14</text>
  </g>

  <g transform="translate(510, 310)">
    <rect width="180" height="34" rx="17" fill="#141414" stroke="#2b2b2b" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#ffffff"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ededed">Sub-10ms Anti-Nuke</text>
  </g>

  <g transform="translate(710, 310)">
    <rect width="130" height="34" rx="17" fill="#141414" stroke="#2b2b2b" stroke-width="1"/>
    <circle cx="20" cy="17" r="4" fill="#ffffff"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#ededed">React + Vite</text>
  </g>
</svg>
